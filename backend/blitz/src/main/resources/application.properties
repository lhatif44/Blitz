# Database
  spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blitz}
  spring.datasource.username=${DB_USERNAME:postgres}
  spring.datasource.password=${DB_PASSWORD:postgres}
  spring.datasource.driver-class-name=org.postgresql.Driver

  # JPA
  spring.jpa.hibernate.ddl-auto=validate
  spring.jpa.show-sql=false
  spring.jpa.properties.hibernate.format_sql=true
  spring.jpa.open-in-view=true
  # batches lazy collection/proxy loads (playerTeams, achievements, draftTeam) into IN-clause
  # queries instead of firing one query per row per association - fixes N+1 on list endpoints
  spring.jpa.properties.hibernate.default_batch_fetch_size=100
  # batches INSERT/UPDATE statements sent to Postgres during ingestion instead of one round trip
  # per row - order_inserts/order_updates group same-table statements so batches stay contiguous
  spring.jpa.properties.hibernate.jdbc.batch_size=50
  spring.jpa.properties.hibernate.order_inserts=true
  spring.jpa.properties.hibernate.order_updates=true

  # Flyway
  spring.flyway.enabled=true
  spring.flyway.locations=classpath:db/migration

  # Scheduling
  spring.task.scheduling.enabled=true

  # App
  server.port=8080

  # Security
  app.admin.api-key=${ADMIN_API_KEY:}
  app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Error handling - never leak stack traces, exception classes, or binding details
  server.error.include-stacktrace=never
  server.error.include-message=never
  server.error.include-binding-errors=never
  server.error.include-exception=false
