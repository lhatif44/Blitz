
  services:
    postgres:
      image: postgres:16
      container_name: blitz-postgres
      environment:
        POSTGRES_DB: blitz
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - blitz-postgres-data:/var/lib/postgresql/data

  volumes:
    blitz-postgres-data:

